[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amdgpu-matrix-model"
version = "0.2.0"
description = "Bit-exact, dependency-free software model of gfx1201 (RDNA 4) WMMA and SWMMAC arithmetic"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tools = ["numpy>=1.26"]

[project.scripts]
amdgpu-matrix-validate = "amdgpu_matrix_model.validation:main"

[tool.setuptools.packages.find]
include = ["amdgpu_matrix_model*"]
